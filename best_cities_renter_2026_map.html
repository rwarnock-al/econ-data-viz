  {category: "Economic Opportunity", rank: 9, city: "Salt Lake City, UT", lat: 40.7608, lon: -111.891},
  {category: "Economic Opportunity", rank: 10, city: "Fort Worth, TX", lat: 32.7555, lon: -97.3308},
  {category: "Lifestyle", rank: 1, city: "San Francisco, CA", lat: 37.7749, lon: -122.4194},
  {category: "Lifestyle", rank: 2, city: "Oakland, CA", lat: 37.8044, lon: -122.2712},
  {category: "Lifestyle", rank: 3, city: "Washington, DC", lat: 38.9072, lon: -77.0369},
  {category: "Lifestyle", rank: 4, city: "Seattle, WA", lat: 47.6062, lon: -122.3321},
  {category: "Lifestyle", rank: 5, city: "San Jose, CA", lat: 37.3382, lon: -121.8863},
  {category: "Lifestyle", rank: 6, city: "Arlington, VA", lat: 38.8799, lon: -77.1068},
  {category: "Lifestyle", rank: 7, city: "San Diego, CA", lat: 32.7157, lon: -117.1611},
  {category: "Lifestyle", rank: 8, city: "Boston, MA", lat: 42.3601, lon: -71.0589},
  {category: "Lifestyle", rank: 9, city: "New York City, NY", lat: 40.7128, lon: -74.006},
  {category: "Lifestyle", rank: 10, city: "Los Angeles, CA", lat: 34.0522, lon: -118.2437},

const W = 775, H = 425, R = 11;            // viewBox size, badge radius
const NON_LOWER48 = new Set(["02", "15", "60", "66", "69", "72", "78"]); // AK, HI, territories
const CATEGORIES = [...new Set(DATA.map(d => d.category))];
const DESCRIPTIONS = {
  "Overall": "Weighted average of five categories: affordability, leverage, cost of living, economy, and lifestyle.",
  "Housing Affordability": "Median Rents + Year-over-year Rent Growth + Renter Cost Burden",
  "Housing Leverage": "Apartment Vacancy Rates + Amenity Scores + Concession Rates.",
  "Cost of Living": "Cost of Groceries, Healthcare, Transportation, and Other Goods & Services.",
  "Economic Opportunity": "Median Renter Household Income + Job Growth + Unemployment Rates",
  "Lifestyle": "General Health Score + Walkability + Good Weather Days",
};
const LABELS = {"Washington, DC": "Washington DC"};  // display-name exceptions
const shortName = city => LABELS[city] || city.split(",")[0];

const svg = d3.select("#map");
const gStates = svg.append("g");
const gLeaders = svg.append("g");
const gBadges = svg.append("g");
let projection, firstRender = true;

// --- Pills -----------------------------------------------------------------
const pills = d3.select(".pills").selectAll("button")
  .data(CATEGORIES).join("button")
  .attr("type", "button").attr("class", "pill")
  .text(d => d)
  .on("click", (_, d) => render(d));

// Hand-placed badges for clusters the automatic nudge can't arrange geographically.
// dx/dy: badge offset (px) from the city's true location; label: forced label side.
const OVERRIDES = {
  "Lifestyle": {
    "San Francisco, CA": {dx: -14, dy: -24, label: "above"},
    "Oakland, CA":       {dx: 14,  dy: -24, label: "right"},
    "San Jose, CA":      {dx: 6,   dy: 27,  label: "right"},
    "Washington, DC":    {dx: 16,  dy: -6,  label: "right"},
    "Arlington, VA":     {dx: -16, dy: 8,   label: "left"},
  },
};

// --- Layout ----------------------------------------------------------------
// 1) project; 2) apply overrides, nudge remaining overlapping badges apart (force sim, run synchronously);
// 3) place each label at the right/left/above/below/diagonal spot with the least overlap area.
// Label positions are stored as the text's left edge (lx) and vertical center (ly) relative to
// the badge, always rendered with text-anchor "start" so they can transition smoothly.
function layout(category) {
  const overrides = OVERRIDES[category] || {};
  const nodes = DATA.filter(d => d.category === category).map(d => {
    const [x, y] = projection([d.lon, d.lat]);
    const o = overrides[d.city];
    return o ? {...d, x0: x, y0: y, x: x + o.dx, y: y + o.dy, fx: x + o.dx, fy: y + o.dy, forceLabel: o.label}
             : {...d, x0: x, y0: y, x, y};
  });
  const sim = d3.forceSimulation(nodes)
    .force("x", d3.forceX(d => d.x0).strength(0.6))
    .force("y", d3.forceY(d => d.y0).strength(0.1))
    .force("collide", d3.forceCollide(R + 3).iterations(4))
    .stop();
  for (let i = 0; i < 300; i++) {
    sim.tick();
    nodes.forEach(n => { n.x = Math.max(R + 2, Math.min(W - R - 2, n.x)); n.y = Math.max(R + 2, Math.min(H - R - 2, n.y)); });
  }
  nodes.forEach(n => { if (n.fx != null) { n.x = n.fx; n.y = n.fy; } });

  const boxes = nodes.map(n => ({x1: n.x - R, y1: n.y - R, x2: n.x + R, y2: n.y + R}));
  const overlapArea = (a, b) =>
    Math.max(0, Math.min(a.x2, b.x2) - Math.max(a.x1, b.x1)) * Math.max(0, Math.min(a.y2, b.y2) - Math.max(a.y1, b.y1));
  const measure = gBadges.append("text").attr("class", "label").style("visibility", "hidden");

  [...nodes].sort((a, b) => a.rank - b.rank).forEach(n => {
    const w = measure.text(shortName(n.city)).node().getComputedTextLength();
    const h = 14, gap = 4, d = R * 0.7;
    const options = [
      {side: "right", lx: R + gap,          ly: 0},
      {side: "left",  lx: -R - gap - w,     ly: 0},
      {side: "above", lx: -w / 2,           ly: -R - gap - h / 2},
      {side: "below", lx: -w / 2,           ly: R + gap + h / 2},
      {side: "below-right", lx: d,          ly: R + h / 2},
      {side: "above-right", lx: d,          ly: -R - h / 2},
      {side: "below-left",  lx: -d - w,     ly: R + h / 2},
      {side: "above-left",  lx: -d - w,     ly: -R - h / 2},
    ].map(o => ({...o, box: {x1: n.x + o.lx, x2: n.x + o.lx + w, y1: n.y + o.ly - h / 2, y2: n.y + o.ly + h / 2}}));
    const inBounds = b => b.x1 >= 0 && b.x2 <= W && b.y1 >= 0 && b.y2 <= H;
    const score = o => (inBounds(o.box) ? 0 : 1e6) + d3.sum(boxes, b => overlapArea(o.box, b));  // least overlap area wins
    const candidates = n.forceLabel ? options.filter(o => o.side === n.forceLabel) : options;
    const best = candidates.reduce((a, b) => score(b) < score(a) ? b : a);
    n.label = best;
    boxes.push(best.box);
  });
  measure.remove();
  return nodes;
}

// --- Render ----------------------------------------------------------------
// Switching categories is a pure crossfade: elements are keyed by category + city, so the old view
// fades out and the new one fades in (no sliding), even for cities that appear in both.
function render(category) {
  pills.attr("aria-pressed", d => d === category);
  d3.select(".desc").text(DESCRIPTIONS[category]);
  const nodes = layout(category);
  const key = d => `${d.category}|${d.city}`;
  const t = svg.transition().duration(firstRender ? 0 : 500);
  firstRender = false;
  svg.selectAll(".exiting").interrupt().remove();  // clear anything still fading out from a previous click

  gLeaders.selectAll("g.leader-g")
    .data(nodes.filter(n => Math.hypot(n.x - n.x0, n.y - n.y0) > R), key)
    .join(
      enter => {
        const g = enter.append("g").attr("class", "leader-g").style("opacity", 0);
        g.append("line").attr("class", "leader")
          .attr("x1", d => d.x0).attr("y1", d => d.y0).attr("x2", d => d.x).attr("y2", d => d.y);
        g.append("circle").attr("class", "anchor").attr("r", 2.5).attr("cx", d => d.x0).attr("cy", d => d.y0);
        return g;
      },
      update => update,
      exit => exit.attr("class", "exiting").transition(t).style("opacity", 0).remove()
    )
    .call(g => g.transition(t).style("opacity", 1));

  gBadges.selectAll("g.badge")
    .data(nodes, key)
    .join(
      enter => {
        const g = enter.append("g").attr("class", "badge")
          .attr("transform", d => `translate(${d.x},${d.y})`).style("opacity", 0);
        g.append("circle").attr("r", R);
        g.append("text").attr("class", "num").text(d => d.rank);
        g.append("text").attr("class", "label").text(d => shortName(d.city))
          .attr("x", d => d.label.lx).attr("y", d => d.label.ly);
        return g;
      },
      update => update,
      exit => exit.attr("class", "exiting").transition(t).style("opacity", 0).remove()
    )
    .sort((a, b) => b.rank - a.rank)  // rank 1 drawn on top
    .call(g => g.transition(t).style("opacity", 1));
}

// --- Init ------------------------------------------------------------------
d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3.0.1/states-10m.json").then(us => {
  const states = topojson.feature(us, us.objects.states);
  states.features = states.features.filter(f => !NON_LOWER48.has(f.id));
  projection = d3.geoAlbers().fitExtent([[50, 10], [W - 50, H - 10]], states);  // side margins leave room for nudged badges/labels
  gStates.selectAll("path").data(states.features).join("path")
    .attr("class", "state").attr("d", d3.geoPath(projection));
  render(CATEGORIES[0]);
});
</script>
